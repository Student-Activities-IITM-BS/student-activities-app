name: student_activities
description: "The native Student Activities experience for the IIT Madras BS community."
publish_to: 'none'
repository: https://github.com/Student-Activities-IITM-BS/student-activities-app

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  crypto: ^3.0.7
  shared_preferences: ^2.5.5
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  url_launcher: ^6.3.1
  dio: ^5.10.0
  flutter_secure_storage: ^10.0.0
  socket_io_client: ^3.1.6
  gpt_markdown: ^1.1.8
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.webp
    - assets/menu_data.json
