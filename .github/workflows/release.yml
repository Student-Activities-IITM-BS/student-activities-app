name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.4"
  APP_VERSION: ${{ github.ref_name }}
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.iitmbs.org' }}

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure Android signing
        env:
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_FILE"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          echo "$KEYSTORE_FILE" | base64 --decode > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../release-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Google configuration
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: test -n "$GOOGLE_CLIENT_ID"

      - name: Build split APKs
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"

      - name: Build Android App Bundle
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"

      - name: Build universal APK
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"

      - name: Rename Android artifacts
        run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk StudentActivities-Android-arm32.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk StudentActivities-Android-arm64.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk StudentActivities-Android-x64.apk
          cp build/app/outputs/flutter-apk/app-release.apk StudentActivities-Android-universal.apk
          cp build/app/outputs/bundle/release/app-release.aab StudentActivities-Android.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: StudentActivities-Android-*

  web:
    name: Web release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Validate Google configuration
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: test -n "$GOOGLE_CLIENT_ID"
      - name: Build web
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          flutter build web --release --no-wasm-dry-run \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
      - name: Archive web bundle
        run: tar -czf StudentActivities-Web.tar.gz -C build/web .
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          path: StudentActivities-Web.tar.gz

  linux:
    name: Linux release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev \
            dpkg-dev rpm ruby ruby-dev build-essential libfuse2 patchelf wget
          sudo gem install --no-document fpm
          wget -O appimagetool-x86_64.AppImage "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Validate Google configuration
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: test -n "$GOOGLE_CLIENT_ID" -a -n "$GOOGLE_DESKTOP_CLIENT_ID" -a -n "$GOOGLE_DESKTOP_CLIENT_SECRET"
      - name: Build Linux
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          flutter build linux --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --dart-define=GOOGLE_DESKTOP_CLIENT_ID="$GOOGLE_DESKTOP_CLIENT_ID" \
            --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET="$GOOGLE_DESKTOP_CLIENT_SECRET"
      - name: Archive Linux bundle
        run: tar -czf StudentActivities-Linux.tar.gz -C build/linux/x64/release/bundle .
      - name: Package Linux DEB
        run: |
          version="${APP_VERSION#v}"
          mkdir -p dist/deb/DEBIAN
          mkdir -p dist/deb/opt/student-activities
          mkdir -p dist/deb/usr/local/bin
          mkdir -p dist/deb/usr/share/applications
          mkdir -p dist/deb/usr/share/icons/hicolor/512x512/apps
          cp -a build/linux/x64/release/bundle/. dist/deb/opt/student-activities/
          ln -s /opt/student-activities/student_activities dist/deb/usr/local/bin/student-activities
          cp web/icons/Icon-512.png dist/deb/usr/share/icons/hicolor/512x512/apps/student-activities.png
          cat > dist/deb/usr/share/applications/student-activities.desktop <<EOF
          [Desktop Entry]
          Name=Student Activities
          Comment=Student Activities for the IIT Madras BS community
          Exec=student-activities
          Icon=student-activities
          Terminal=false
          Type=Application
          Categories=Education;Utility;
          EOF
          cat > dist/deb/DEBIAN/control <<EOF
          Package: student-activities
          Version: $version
          Section: education
          Priority: optional
          Architecture: amd64
          Maintainer: SEC WebOps
          Depends: libgtk-3-0, libsecret-1-0
          Description: Student Activities
           Native Student Activities app for the IIT Madras BS community.
          EOF
          dpkg-deb --build --root-owner-group dist/deb StudentActivities-Linux.deb
      - name: Package Linux RPM
        run: |
          version="${APP_VERSION#v}"
          mkdir -p dist/rpm/opt/student-activities
          mkdir -p dist/rpm/usr/local/bin
          mkdir -p dist/rpm/usr/share/applications
          mkdir -p dist/rpm/usr/share/icons/hicolor/512x512/apps
          cp -a build/linux/x64/release/bundle/. dist/rpm/opt/student-activities/
          ln -s /opt/student-activities/student_activities dist/rpm/usr/local/bin/student-activities
          cp web/icons/Icon-512.png dist/rpm/usr/share/icons/hicolor/512x512/apps/student-activities.png
          cat > dist/rpm/usr/share/applications/student-activities.desktop <<EOF
          [Desktop Entry]
          Name=Student Activities
          Comment=Student Activities for the IIT Madras BS community
          Exec=student-activities
          Icon=student-activities
          Terminal=false
          Type=Application
          Categories=Education;Utility;
          EOF
          fpm -s dir -t rpm -n student-activities -v "$version" \
            --package StudentActivities-Linux.rpm \
            --license Apache-2.0 \
            --url https://github.com/Student-Activities-IITM-BS/student-activities-app \
            --description "Student Activities for the IIT Madras BS community" \
            --depends gtk3 \
            --depends libsecret \
            -C dist/rpm .
      - name: Package Linux AppImage
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          cp -a build/linux/x64/release/bundle/. AppDir/usr/bin/
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/usr/bin/student_activities" "$@"
          EOF
          chmod +x AppDir/AppRun
          cp web/icons/Icon-512.png AppDir/student-activities.png
          cat > AppDir/student-activities.desktop <<'EOF'
          [Desktop Entry]
          Name=Student Activities
          Comment=Student Activities for the IIT Madras BS community
          Exec=student_activities
          Icon=student-activities
          Terminal=false
          Type=Application
          Categories=Education;Utility;
          EOF
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir StudentActivities-Linux.AppImage
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            StudentActivities-Linux.tar.gz
            StudentActivities-Linux.deb
            StudentActivities-Linux.rpm
            StudentActivities-Linux.AppImage

  windows:
    name: Windows release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Validate Google configuration
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        shell: pwsh
        run: if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_ID) -or [string]::IsNullOrWhiteSpace($env:GOOGLE_DESKTOP_CLIENT_ID) -or [string]::IsNullOrWhiteSpace($env:GOOGLE_DESKTOP_CLIENT_SECRET)) { throw "GOOGLE_CLIENT_ID, GOOGLE_DESKTOP_CLIENT_ID, and GOOGLE_DESKTOP_CLIENT_SECRET are required" }
      - name: Build Windows
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        shell: pwsh
        run: flutter build windows --release "--dart-define=API_BASE_URL=$env:API_BASE_URL" "--dart-define=GOOGLE_CLIENT_ID=$env:GOOGLE_CLIENT_ID" "--dart-define=GOOGLE_DESKTOP_CLIENT_ID=$env:GOOGLE_DESKTOP_CLIENT_ID" "--dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=$env:GOOGLE_DESKTOP_CLIENT_SECRET"
      - name: Archive Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath StudentActivities-Windows.zip
      - name: Copy Windows executable
        shell: pwsh
        run: Copy-Item build/windows/x64/runner/Release/student_activities.exe StudentActivities-Windows.exe
      - name: Create Windows installer script
        shell: pwsh
        run: |
          $version = $env:APP_VERSION -replace '^v', ''
          @"
          [Setup]
          AppName=Student Activities
          AppVersion=$version
          AppPublisher=SEC WebOps
          AppPublisherURL=https://iitmbs.org
          AppSupportURL=https://github.com/Student-Activities-IITM-BS/student-activities-app
          DefaultDirName={autopf}\Student Activities
          DefaultGroupName=Student Activities
          UninstallDisplayIcon={app}\student_activities.exe
          SetupIconFile=runner\resources\app_icon.ico
          ArchitecturesInstallIn64BitMode=x64
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          OutputBaseFilename=StudentActivities-Windows-installer
          OutputDir=Output

          [Files]
          Source: "..\build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Student Activities"; Filename: "{app}\student_activities.exe"
          Name: "{autodesktop}\Student Activities"; Filename: "{app}\student_activities.exe"
          "@ | Set-Content windows/installer.iss
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path @('C:\Program Files (x86)\Inno Setup*', 'C:\Program Files\Inno Setup*') -Filter iscc.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found.' }
          & $iscc.FullName windows/installer.iss
          Move-Item windows/Output/StudentActivities-Windows-installer.exe StudentActivities-Windows-installer.exe
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            StudentActivities-Windows.zip
            StudentActivities-Windows.exe
            StudentActivities-Windows-installer.exe

  ios:
    name: iOS release
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Validate Google configuration
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: test -n "$GOOGLE_CLIENT_ID"
      - name: Build iOS without signing
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/StudentActivities.app
          zip -r9 --symlinks StudentActivities-iOS.ipa Payload
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: StudentActivities-iOS.ipa

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, web, linux, windows, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: artifacts
      - name: Download web artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-artifacts
          path: artifacts
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts
      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-artifacts
          path: artifacts
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
