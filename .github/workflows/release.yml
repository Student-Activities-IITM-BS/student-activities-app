name: Release Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.4"
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.iitmbs.org' }}

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure Android signing
        env:
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_FILE"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          echo "$KEYSTORE_FILE" | base64 --decode > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../release-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Google configuration
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: test -n "$GOOGLE_CLIENT_ID"

      - name: Build split APKs
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"

      - name: Build Android App Bundle
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"

      - name: Build universal APK
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"

      - name: Rename Android artifacts
        run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk StudentActivities-Android-arm32.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk StudentActivities-Android-arm64.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk StudentActivities-Android-x64.apk
          cp build/app/outputs/flutter-apk/app-release.apk StudentActivities-Android-universal.apk
          cp build/app/outputs/bundle/release/app-release.aab StudentActivities-Android.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: StudentActivities-Android-*

  web:
    name: Web release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Validate Google configuration
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: test -n "$GOOGLE_CLIENT_ID"
      - name: Build web
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          flutter build web --release --no-wasm-dry-run \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
      - name: Archive web bundle
        run: tar -czf StudentActivities-Web.tar.gz -C build/web .
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          path: StudentActivities-Web.tar.gz

  linux:
    name: Linux release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Validate Google configuration
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: test -n "$GOOGLE_CLIENT_ID"
      - name: Build Linux
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          flutter build linux --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
      - name: Archive Linux bundle
        run: tar -czf StudentActivities-Linux.tar.gz -C build/linux/x64/release/bundle .
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: StudentActivities-Linux.tar.gz

  windows:
    name: Windows release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Install dependencies
        run: flutter pub get
      - name: Validate Google configuration
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        shell: pwsh
        run: if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_ID)) { throw "GOOGLE_CLIENT_ID is required" }
      - name: Build Windows
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        shell: pwsh
        run: flutter build windows --release "--dart-define=API_BASE_URL=$env:API_BASE_URL" "--dart-define=GOOGLE_CLIENT_ID=$env:GOOGLE_CLIENT_ID"
      - name: Archive Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath StudentActivities-Windows.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: StudentActivities-Windows.zip

  ios:
    name: iOS release
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Validate Google configuration
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: test -n "$GOOGLE_CLIENT_ID"
      - name: Build iOS without signing
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/StudentActivities.app
          zip -r9 --symlinks StudentActivities-iOS.ipa Payload
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: StudentActivities-iOS.ipa

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, web, linux, windows, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts
          path: artifacts
      - name: Download web artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-artifacts
          path: artifacts
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts
      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-artifacts
          path: artifacts
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
